<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Jedno — Archidiecezja Gdańska</title>
    <!-- GitHub Pages SPA redirect (rafgraph/spa-github-pages). Pairs with the restore script in index.html. -->
    <script>
      // pathSegmentsToKeep = 1 because the site lives at https://<user>.github.io/jedno-agregator/
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
