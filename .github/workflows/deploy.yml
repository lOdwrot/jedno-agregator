name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Once a day at 04:00 UTC = 05:00 in Poland in winter (CET), 06:00 in summer (CEST).
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck + lint + unit tests only on pushes; scheduled refreshes just rebuild data.
      - name: Check
        if: github.event_name != 'schedule'
        run: npm run check

      - name: Fetch data snapshots
        run: npm run fetch-data
        env:
          JEDNO_API_KEY: ${{ secrets.JEDNO_API_KEY }}

      - run: npm run build
        env:
          # Umami website id (public, not a secret) — repository variable; empty = no statistics.
          VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

      # Smoke + axe accessibility tests against the built site (pushes only).
      - name: E2E (Playwright + axe)
        if: github.event_name != 'schedule'
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
